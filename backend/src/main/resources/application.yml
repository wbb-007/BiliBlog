spring:
  application:
    name: blogbili-backend
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:blogbili}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true&createDatabaseIfNotExist=true}
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${DB_USERNAME:blogbili_app}
    password: ${DB_PASSWORD:Blogbili@2026!}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        jdbc:
          time_zone: Asia/Shanghai
  mail:
    host: ${MAIL_HOST:}
    port: ${MAIL_PORT:587}
    protocol: ${MAIL_PROTOCOL:smtp}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always

blog:
  admin:
    email: ${BLOG_ADMIN_EMAIL:admin@biliblog.local}
    nickname: ${BLOG_ADMIN_NICKNAME:Site Admin}
    initial-password: ${BLOG_ADMIN_INITIAL_PASSWORD:Admin@123456}
  auth:
    code-minutes: ${BLOG_AUTH_CODE_MINUTES:10}
    session-days: ${BLOG_AUTH_SESSION_DAYS:7}
  mail:
    from: ${BLOG_MAIL_FROM:${MAIL_USERNAME:}}
    debug-return-code: ${BLOG_MAIL_DEBUG_RETURN_CODE:false}
