services:
  db:
    image: mariadb:11
    container_name: biliblog-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_NAME:-blogbili}
      MYSQL_USER: ${DB_USERNAME:-blogbili_app}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-time-zone=+08:00
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mariadb-admin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: biliblog-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-blogbili}
      DB_USERNAME: ${DB_USERNAME:-blogbili_app}
      DB_PASSWORD: ${DB_PASSWORD}
      BLOG_ADMIN_EMAIL: ${BLOG_ADMIN_EMAIL:-admin@biliblog.local}
      BLOG_ADMIN_NICKNAME: ${BLOG_ADMIN_NICKNAME:-Site Admin}
      BLOG_ADMIN_INITIAL_PASSWORD: ${BLOG_ADMIN_INITIAL_PASSWORD:-ChangeMe@123456}
      MAIL_HOST: ${MAIL_HOST:-}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      BLOG_MAIL_FROM: ${BLOG_MAIL_FROM:-}
      BLOG_MAIL_DEBUG_RETURN_CODE: ${BLOG_MAIL_DEBUG_RETURN_CODE:-false}
      BLOG_UPLOAD_DIR: /app/uploads
      JPA_DDL_AUTO: update
      SERVER_PORT: 8080
      TZ: Asia/Shanghai
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
    container_name: biliblog-frontend
    restart: unless-stopped
    depends_on:
      - backend

  caddy:
    image: caddy:2.8-alpine
    container_name: biliblog-caddy
    restart: unless-stopped
    depends_on:
      - frontend
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:-localhost}
      ACME_EMAIL: ${ACME_EMAIL:-}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  mysql_data:
  uploads:
  caddy_data:
  caddy_config:
